<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenRouter">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>OpenRouter · PWA Client</title>

  <!-- Separate Google Fonts links: Google Sans, Google Sans Code, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       SHARED DESIGN TOKENS — Pure Flat Borderless Monochrome Dark Theme
       ZERO borders and ZERO outlines anywhere across the entire application
       ========================================================================== */
    :root {
      --bg: #000000;
      --menu-bg: #1e1f24;
      --menu-dark: #15161a;
      --surface-composer: #2e3038;
      --composer-btn: #3e414c;
      --save-bg: #cfd2da;
      --save-fg: #121316;
      --menu-item-h: 44px;

      --menu-text: #c4c7ce;
      --menu-active-text: #f1f3f6;
      --menu-font-size: 15px;

      --bg-code: #1e1f20;
      --bg-header-btn: #222428;
      --bg-header-btn-active: #30333a;
      --bg-surface-hover: #353842;

      --composer-btn-active: #4b4f5c;
      --send-ready-bg: #575c69;
      --send-stop-bg: #6b2b30;
      --mic-rec-bg: #7a292e;
      --mic-transcribing-bg: #474b57;

      --bg-drawer: #111113;
      --bg-drawer-plaque: #1a1b1f;
      --bg-drawer-tab-active: #2d3036;
      --bg-drawer-input: #111113;
      --bg-drawer-row-active: #1c1e22;
      --bg-drawer-row-selected: #24272d;
      --bg-drawer-row-ctx: #2a2d35;
      --bg-checkbox-off: #2a2c32;
      --bg-ctx-menu: #222428;

      --bg-scroll-btn: #2b2e34;
      --bg-scroll-btn-active: #3a3e47;

      --text-bright: #ffffff;
      --text-header: #e3e3e3;
      --text-chat: #d3d5d9;
      --text-input: #c8cbd0;
      --text-placeholder: #7a7e86;
      --text-btn-bright: #f0f2f5;
      --text-code: #c4c7c5;
      --text-chevron: #c4c7c5;
      --text-thinking: #a8abb0;
      --text-level: #8e9196;
      --text-clear-x: #848891;
      --text-meta: #6e717a;
      --text-dim: #58585e;
      --text-disabled: #5a5d66;

      --pill-light-bg: #e3e3e3;
      --pill-light-text: #111215;
      --rec-red: #f05d62;

      --radius-pill: 9999px;
      --radius-card: 20px;
      --radius-popover: 18px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --font-sans: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Google Sans Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ==========================================================================
       GLOBAL ZERO-BORDER & iOS LONG-PRESS SELECTION LOCK
       ========================================================================== */
    html, body, *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* Allow selection ONLY inside .msg-body when the drawer is closed */
    body:not(.drawer-open) .msg-body,
    body:not(.drawer-open) .msg-body * {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* Completely suppress selection inside and outside drawer while drawer is open */
    body.drawer-open .app-shell,
    body.drawer-open .chat-feed,
    body.drawer-open .drawer-backdrop,
    body.drawer-open .msg-body,
    body.drawer-open .msg-body * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body.drawer-open .drawer input,
    body.drawer-open .drawer textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }

    /* ==========================================================================
       FULL-APP UI LOCK DURING MIC RECORDING & TRANSCRIPTION
       ========================================================================== */
    body.mic-recording .top-header,
    body.mic-recording .chat-feed,
    body.mic-recording .scroll-bottom-btn,
    body.mic-recording .tier2-row,
    body.mic-recording .floating-panels-layer,
    body.mic-recording .dock-scrim,
    body.mic-recording .plus-btn,
    body.mic-recording .composer-input-wrap,
    body.mic-recording .send-btn,
    body.mic-recording .drawer,
    body.mic-recording .drawer-backdrop,
    body.mic-transcribing .top-header,
    body.mic-transcribing .chat-feed,
    body.mic-transcribing .scroll-bottom-btn,
    body.mic-transcribing .tier2-row,
    body.mic-transcribing .floating-panels-layer,
    body.mic-transcribing .dock-scrim,
    body.mic-transcribing .plus-btn,
    body.mic-transcribing .composer-input-wrap,
    body.mic-transcribing .send-btn,
    body.mic-transcribing .drawer,
    body.mic-transcribing .drawer-backdrop {
      pointer-events: none !important;
    }

    body.mic-recording .top-header,
    body.mic-recording .tier2-row,
    body.mic-recording .scroll-bottom-btn,
    body.mic-recording .plus-btn,
    body.mic-recording .send-btn,
    body.mic-recording .msg-footer,
    body.mic-transcribing .top-header,
    body.mic-transcribing .tier2-row,
    body.mic-transcribing .scroll-bottom-btn,
    body.mic-transcribing .plus-btn,
    body.mic-transcribing .send-btn,
    body.mic-transcribing .msg-footer {
      opacity: 0.35;
      transition: opacity 0.16s ease;
    }

    body.mic-recording #btn-mic {
      pointer-events: auto !important;
      opacity: 1 !important;
    }

    body.mic-transcribing #btn-mic {
      pointer-events: none !important;
      cursor: default;
    }

    /* ==========================================================================
       BASE & iOS PWA GEOMETRY
       ========================================================================== */
    html, body {
      width: 100%;
      height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: var(--bg);
      color: var(--text-chat);
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.52;
      font-weight: 400;
      letter-spacing: -0.005em;
      font-optical-sizing: auto;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: var(--font-sans);
      font-optical-sizing: auto;
      color: inherit;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Strictly >= 16px on all inputs/textareas to prevent iOS Safari zoom */
    input {
      font-family: var(--font-sans);
      font-optical-sizing: auto;
      font-size: 16px !important;
      color: var(--text-input);
      caret-color: var(--text-input);
      background: transparent;
      border: none;
      outline: none;
      -webkit-font-smoothing: antialiased;
    }

    textarea {
      font-family: var(--font-sans);
      font-optical-sizing: auto;
      font-size: 16px;
      color: var(--text-input);
      caret-color: var(--text-input);
      background: transparent;
      border: none;
      outline: none;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      margin: 0 auto;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      .app-shell {
        max-width: 390px;
        box-shadow: 0 0 72px rgba(255, 255, 255, 0.05), 0 0 48px rgba(0, 0, 0, 0.9);
      }
    }

    /* ==========================================================================
       1. SINGLE-ROW TOP HEADER (Menu | Centered Model+Level | New Chat)
       ========================================================================== */
    .top-header {
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      background-color: var(--bg);
      padding: max(10px, var(--safe-top)) 12px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .hdr-circle-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      background-color: var(--bg-header-btn);
      color: var(--text-header);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, transform 0.1s ease;
    }

    .hdr-circle-btn:active {
      background-color: var(--bg-header-btn-active);
      transform: scale(0.93);
    }

    .hdr-circle-btn svg {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-center {
      flex: 1;
      min-width: 0;
      margin: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gemini-model-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      padding: 6px 10px;
      border-radius: 12px;
      line-height: 1.2;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 0.12s ease;
    }

    .gemini-model-trigger:active {
      opacity: 0.65;
    }

    .gmt-model {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-header);
      letter-spacing: -0.012em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .gmt-level {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-level);
      letter-spacing: -0.012em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .gmt-level.hidden {
      display: none;
    }

    .gmt-chev {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--text-chevron);
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: -1px;
      transition: transform 0.16s ease;
    }

    .gemini-model-trigger.open .gmt-chev {
      transform: rotate(180deg);
    }

    /* ==========================================================================
       2. BORDERLESS POPOVERS & CENTER MODEL DROPDOWN (FIX #1a & #1b)
       ========================================================================== */
    .popover-backdrop {
      position: absolute;
      inset: 0;
      z-index: 58;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .popover-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .popover-menu {
      position: absolute;
      z-index: 60;
      min-width: 224px;
      max-width: calc(100% - 20px);
      max-height: 62dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--menu-bg);
      border-radius: var(--radius-popover);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.84);
      padding: 6px;
      opacity: 0;
      transform: translate3d(0, -6px, 0) scale(0.97);
      will-change: transform, opacity;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .popover-menu.drop-up {
      transform: translate3d(0, 6px, 0) scale(0.97);
    }

    .popover-menu.open {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }

    /* FIX #1a: Full viewport-aware height so 5 models + Thinking + Flex never clip */
    .popover-menu.gemini-model-menu {
      width: 268px;
      min-width: 268px;
      max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 96px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      border-radius: 18px;
      padding: 8px;
    }

    .popover-menu.selector-menu {
      padding: 6px;
      overflow-x: hidden;
    }

    .mdd-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .model-opt {
      width: 100%;
      height: var(--menu-item-h);
      min-height: var(--menu-item-h);
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1.25;
      color: var(--menu-text);
      background-color: transparent;
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    /* Compact 42px model rows inside the center model dropdown */
    .gemini-model-menu .model-opt {
      height: 42px;
      min-height: 42px;
    }

    .model-opt span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-opt:active {
      background-color: var(--bg-surface-hover);
    }

    .model-opt.selected {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    .mdd-check {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: var(--menu-active-text);
      opacity: 0;
    }

    .model-opt.selected .mdd-check {
      opacity: 1;
    }

    /* FIX #1b: Unified #15161a container wrapping Thinking title AND its options */
    .mdd-thinking-group {
      background-color: var(--menu-dark);
      border-radius: 12px;
      margin: 4px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mdd-thinking-btn {
      width: 100%;
      height: 40px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1.25;
      color: var(--menu-text);
      background-color: transparent;
      text-align: left;
      transition: background-color 0.12s ease;
    }

    .mdd-thinking-btn:active {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .mdd-thinking-chev {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-chevron);
    }

    .mdd-thinking-chev svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mdd-thinking-btn.expanded .mdd-thinking-chev svg {
      transform: rotate(90deg);
    }

    .mdd-thinking-current {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-level);
    }

    /* Zero-bleed collapsed options grid (padding: 0, visibility: hidden, opacity: 0) */
    .mdd-thinking-panel {
      display: grid;
      grid-template-rows: 0fr;
      overflow: hidden;
      margin: 0;
      padding: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        grid-template-rows 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.14s ease,
        visibility 0s linear 0.18s;
    }

    .mdd-thinking-panel.expanded {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        grid-template-rows 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.14s ease,
        visibility 0s linear 0s;
    }

    .mdd-thinking-inner {
      overflow: hidden;
      min-height: 0;
      padding: 0;
      margin: 0;
    }

    .mdd-thinking-list {
      padding: 0 4px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mdd-think-opt {
      width: 100%;
      height: 36px;
      min-height: 36px;
      padding: 0 10px 0 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14.5px;
      color: var(--menu-text);
      background-color: transparent;
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .mdd-think-opt:active {
      background-color: var(--bg-surface-hover);
    }

    .mdd-think-opt.selected {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    .mdd-think-opt .mdd-check {
      width: 15px;
      height: 15px;
    }

    .mdd-think-opt.selected .mdd-check {
      opacity: 1;
    }

    /* Flat Flex row directly on #1e1f24 below the Thinking container */
    .mdd-flex-item {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1.25;
      background-color: transparent;
      color: var(--menu-text);
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .mdd-flex-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .mdd-flex-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
      opacity: 0.85;
    }

    .mdd-flex-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mdd-flex-item:active {
      background-color: var(--bg-surface-hover);
    }

    .mdd-flex-item.is-on {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    .mdd-flex-item.is-on .mdd-check {
      opacity: 1;
    }

    .mdd-flex-item.is-disabled {
      background-color: transparent;
      color: var(--text-disabled);
      pointer-events: none;
    }

    /* Compact Borderless ••• Message Info Popover */
    .popover-menu.info-popover {
      min-width: 196px;
      width: auto;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.84);
    }

    .info-pop-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-pop-time {
      font-size: 13px;
      line-height: 1.3;
      color: var(--text-header);
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }

    .info-pop-model {
      font-size: 13px;
      line-height: 1.3;
      color: var(--text-level);
      padding: 6px 8px;
      border-radius: 8px;
      background-color: var(--menu-dark);
      white-space: nowrap;
    }

    .info-pop-model strong {
      color: var(--menu-active-text);
      font-weight: 500;
    }

    /* ==========================================================================
       3. CHAT FEED & USER CARD (FIX #3: #1e1f24 USER CARD)
       ========================================================================== */
    .chat-feed {
      flex: 1;
      min-height: 0;
      margin-bottom: var(--feed-bottom, 173px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      background-color: var(--bg);
      padding: 8px 16px 34px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat-empty {
      margin: auto 0;
      text-align: center;
      padding: 40px 20px 44px;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .chat-empty-title {
      font-size: 19px;
      font-weight: 500;
      color: var(--text-level);
    }

    .msg-block {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* FIX #3: User message card matches previous Tier-2 surface (#1e1f24) */
    .msg-user-card {
      align-self: flex-end;
      max-width: 88%;
      background-color: var(--menu-bg);
      border-radius: var(--radius-card);
      padding: 13px 16px;
      transition: background-color 0.14s ease;
    }

    .msg-user-card.collapsed {
      cursor: pointer;
    }

    .msg-body {
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.52;
      font-weight: 400;
      letter-spacing: -0.005em;
      font-optical-sizing: auto;
      font-variation-settings: "opsz" 17;
      color: var(--text-chat);
      word-break: break-word;
    }

    .msg-user-card .msg-body {
      white-space: pre-wrap;
    }

    .ai-content {
      width: 100%;
    }

    .ai-content p + p,
    .ai-content p + ul,
    .ai-content ul + p {
      margin-top: 11px;
    }

    .ai-content ul {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ai-content strong {
      color: var(--text-header);
      font-weight: 500;
    }

    .msg-body code {
      font-family: var(--font-mono);
      font-size: 15px;
      background-color: var(--bg-code);
      color: var(--text-code);
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0;
      font-variation-settings: normal;
    }

    .clamped {
      position: relative;
      max-height: calc(17px * 1.52 * 3);
      overflow: hidden;
    }

    /* Smooth bottom fade into #1e1f24 for collapsed user cards */
    .msg-user-card .clamped::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.75em;
      background: linear-gradient(180deg, rgba(30, 31, 36, 0) 0%, #1e1f24 92%);
      pointer-events: none;
    }

    /* Smooth bottom fade into #000000 for collapsed AI responses */
    .ai-content.clamped::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.75em;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000000 92%);
      pointer-events: none;
    }

    /* LIVE-ONLY Gemini 3-Dot Orbital Thinking Spinner */
    .live-thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0 6px;
    }

    .gemini-dot-spinner {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      position: relative;
      animation: orbitSpin 1.8s linear infinite;
    }

    .gemini-dot-spinner span {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #c4c7c5;
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .gemini-dot-spinner span:nth-child(1) { top: 1px; left: 7px; animation-delay: 0s; }
    .gemini-dot-spinner span:nth-child(2) { bottom: 2px; left: 2px; animation-delay: 0.4s; }
    .gemini-dot-spinner span:nth-child(3) { bottom: 2px; right: 2px; animation-delay: 0.8s; }

    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .live-thinking-text {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-thinking);
      letter-spacing: -0.005em;
      animation: thinkingFade 1.5s ease-in-out infinite;
    }

    @keyframes thinkingFade {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    .stream-cursor {
      display: inline-block;
      width: 7px;
      height: 17px;
      background: var(--text-level);
      vertical-align: -2px;
      margin-left: 3px;
      border-radius: 2px;
      animation: blink 0.85s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.15; }
    }

    /* Unified Right-Aligned 5-Icon Dim Footer (Copy -> Delete -> Speak -> ••• -> Collapse) */
    .msg-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 6px;
      padding: 0 2px;
      min-height: 30px;
      width: 100%;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .msg-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.14s ease, background-color 0.14s ease, transform 0.1s ease;
    }

    .msg-icon-btn:active {
      background-color: #1c1e22;
      color: var(--text-header);
      transform: scale(0.92);
    }

    .msg-icon-btn.active {
      color: var(--text-header);
    }

    .msg-icon-btn.speaking {
      color: var(--text-bright);
      animation: speakPulse 1.1s ease-in-out infinite;
    }

    @keyframes speakPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .msg-icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .msg-icon-btn.collapse-btn.is-expanded svg {
      transform: rotate(180deg);
    }

    /* ==========================================================================
       4. TRANSPARENT FLOATING BOTTOM DOCK & DECOUPLED PANEL LAYERS
       ========================================================================== */
    .dock-scrim {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .dock-scrim.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: transparent;
      pointer-events: none;
      padding-top: 4px;
      padding-bottom: max(42px, calc(env(safe-area-inset-bottom, 0px) + 16px));
      display: flex;
      flex-direction: column;
    }

    /* Full-width cool slate-graphite gradient plaque starting flush at top of 44px button row (top: 21px = bottom of .chat-feed):
       - Spread higher behind composer & lower half of upper buttons, melting into #000000 around the 50% midline (22px) -> never overlaps native iOS scrollbar */
    .bottom-dock::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 21px;
      bottom: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          to bottom,
          rgba(62, 65, 76, 0) 0px,
          rgba(62, 65, 76, 0.035) 10px,
          rgba(62, 65, 76, 0.11) 18px,
          rgba(62, 65, 76, 0.18) 24px,
          rgba(62, 65, 76, 0.255) 34px,
          rgba(62, 65, 76, 0.31) 50px,
          rgba(62, 65, 76, 0.35) 88px,
          rgba(62, 65, 76, 0.40) 100%
        ),
        #000000;
    }

    /* Silky 11-stop eased black text fade strictly inside current bounds (left/right: 10px, top: -16px, height: 37px)
       so scrolled text melts smoothly behind the protruding Persona circle without touching the scrollbar */
    .bottom-dock::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      top: -16px;
      height: 37px;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0.022) 4px,
        rgba(0, 0, 0, 0.097) 8px,
        rgba(0, 0, 0, 0.223) 12px,
        rgba(0, 0, 0, 0.388) 16px,
        rgba(0, 0, 0, 0.568) 20px,
        rgba(0, 0, 0, 0.738) 24px,
        rgba(0, 0, 0, 0.876) 28px,
        rgba(0, 0, 0, 0.964) 32px,
        rgba(0, 0, 0, 0.995) 35px,
        #000000 37px
      );
    }

    @media (min-width: 520px) {
      .bottom-dock {
        max-width: 390px;
        margin: 0 auto;
      }
    }

    /* Centered 38x38 Circular Scroll-to-Bottom Button */
    .scroll-bottom-btn {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--bg-scroll-btn);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.68);
      color: #e6e8ec;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px) scale(0.92);
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.14s ease;
    }

    .scroll-bottom-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }

    .scroll-bottom-btn:active {
      background-color: var(--bg-scroll-btn-active);
      transform: translate(-50%, 0) scale(0.93);
    }

    .scroll-bottom-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       4A. TIER-2 ROW (Agent Circle + Speaker Circle | Scrub Bar | Hands Free + Auto TTS)
       ========================================================================== */
    .tier2-row {
      --t2-gap: 6px;
      display: flex;
      align-items: flex-end;
      gap: var(--t2-gap);
      padding: 0 10px;
      margin-bottom: 7.5px;
      width: 100%;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: layout style;
    }

    .t2-agent-pair {
      display: inline-flex;
      align-items: flex-end;
      gap: var(--t2-gap);
      flex-shrink: 0;
      pointer-events: none;
    }

    .t2-modes-pair {
      display: inline-flex;
      align-items: flex-end;
      gap: var(--t2-gap);
      flex-shrink: 0;
      pointer-events: none;
    }

    .tier2-btn {
      pointer-events: auto;
      height: var(--menu-item-h);
      min-height: var(--menu-item-h);
      padding: 0 10px;
      border-radius: 9999px;
      background-color: var(--surface-composer);
      color: var(--menu-text);
      font-family: var(--font-sans);
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.008em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.52);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }

    .tier2-btn:active {
      transform: scale(0.94);
    }

    /* Pressed / active Tier-2 pills use IDENTICAL Save button colors (#cfd2da / #121316) */
    .tier2-btn.is-active {
      background-color: var(--save-bg);
      color: var(--save-fg);
      font-weight: 500;
    }

    /* Circular 61x61 Persona / Agent Avatar Button (r = 30.5px, avg of 25px plus & 36px composer) */
    .t2-persona {
      width: 61px;
      height: 61px;
      min-width: 61px;
      min-height: 61px;
      padding: 0;
      border-radius: 50%;
      overflow: hidden;
    }

    .t2-persona svg {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Circular 44x44 Speaker Button paired closely next to Persona */
    .t2-audio {
      width: var(--menu-item-h);
      height: var(--menu-item-h);
      min-width: var(--menu-item-h);
      min-height: var(--menu-item-h);
      padding: 0;
      border-radius: 50%;
    }

    .t2-audio svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Wide TTS Audio Scrub Bar filling all space between Speaker and Right Modes */
    .t2-scrub-bar {
      --scrub-buffered: 0%;
      --scrub-progress: 0%;
      pointer-events: auto;
      position: relative;
      flex: 1;
      min-width: 0;
      height: var(--menu-item-h);
      min-height: var(--menu-item-h);
      border-radius: 9999px;
      background-color: var(--surface-composer);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.52);
      overflow: hidden;
      display: flex;
      align-items: center;
      touch-action: none;
    }

    .t2-scrub-bar * {
      touch-action: none;
    }

    /* Layer 1: Loaded chunks buffer (slightly darker than playback progress) */
    .t2-scrub-buffered {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 0;
      width: var(--scrub-buffered);
      background-color: #3b3d46;
      pointer-events: none;
      transition: width 0.24s ease-out;
    }

    /* Layer 2: Active playback progress (same tone as original progress fill) */
    .t2-scrub-fill {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1;
      width: var(--scrub-progress);
      background-color: #484a52;
      pointer-events: none;
      transition: width 0.18s linear;
    }

    .t2-scrub-bar.is-scrubbing .t2-scrub-fill {
      transition: none;
    }

    .t2-scrub-controls {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      padding: 0 3px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .t2-scrub-btn {
      width: 34px;
      height: 38px;
      border-radius: 9999px;
      color: var(--menu-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.12s ease, color 0.12s ease, transform 0.1s ease;
    }

    .t2-scrub-btn:active {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--menu-active-text);
      transform: scale(0.92);
    }

    .t2-scrub-btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      stroke: none;
    }

    .t2-scrub-play {
      width: 36px;
      color: var(--menu-active-text);
    }

    .t2-scrub-play svg {
      width: 16px;
      height: 16px;
      transform: translateX(1px);
    }

    .t2-scrub-play.is-playing svg {
      transform: none;
    }

    /* Compact Equal-Width Right Pills: Hands Free & Auto TTS */
    .t2-mode-pill {
      width: 54px;
      min-width: 54px;
      height: var(--menu-item-h);
      min-height: var(--menu-item-h);
      padding: 0 6px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 500;
      line-height: 1.06;
      letter-spacing: -0.01em;
      text-align: center;
      white-space: normal;
      flex-direction: column;
      gap: 0;
    }

    .t2-mode-label {
      display: block;
      line-height: 1.08;
    }

    @media (max-width: 380px) {
      .tier2-row {
        --t2-gap: 5px;
        padding: 0 8px;
      }
      .t2-mode-pill {
        width: 50px;
        min-width: 50px;
        font-size: 11px;
        padding: 0 4px;
      }
      .t2-scrub-btn {
        width: 30px;
      }
      .t2-scrub-play {
        width: 34px;
      }
    }

    /* ==========================================================================
       4B & 4C. DECOUPLED FLOATING OVERLAY PANELS LAYER (z-index: 55)
       ========================================================================== */
    .floating-panels-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 55;
      pointer-events: none;
      --panels-bottom: 166px;
    }

    @media (min-width: 520px) {
      .floating-panels-layer {
        max-width: 390px;
        margin: 0 auto;
      }
    }

    .slide-panel {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: var(--panels-bottom);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--menu-bg);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.84);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate3d(0, 8px, 0);
      will-change: transform, opacity;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transition:
        opacity 0.16s ease,
        transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0.18s;
    }

    .slide-panel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
      transition:
        opacity 0.16s ease,
        transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }

    /* Balance & Billing Accordion Header Value + Inner Drawer Stats Styling */
    .accordion-trigger-right {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .accordion-balance-val {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--menu-active-text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }

    .balance-accordion-body {
      padding: 2px 11px 12px;
    }

    .balance-accordion-body .stats-quota-box {
      background: var(--bg-drawer-tab-active);
    }

    .balance-accordion-body .stats-table {
      background: var(--bg-drawer-input);
    }

    .stats-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .stats-top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .stats-balance-val {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-bright);
      font-variant-numeric: tabular-nums;
    }

    .stats-balance-lbl {
      font-size: 12px;
      color: var(--text-level);
    }

    .stats-limit-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stats-limit-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-level);
      font-variant-numeric: tabular-nums;
    }

    .stats-progress-track {
      width: 100%;
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--surface-composer);
      overflow: hidden;
    }

    .stats-progress-fill {
      height: 100%;
      background: var(--text-header);
      border-radius: var(--radius-pill);
    }

    .stats-quota-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 11px;
      background: var(--surface-composer);
      border-radius: 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .stats-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 11px;
      border-radius: 12px;
      background: var(--menu-dark);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stats-row-name {
      color: var(--text-header);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stats-row-sub {
      color: var(--text-level);
      font-size: 12px;
    }

    .stats-row-val {
      color: var(--text-header);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Preset Row: 4 equal-width buttons + Save */
    .panel-presets-row {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .panel-preset-btn {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      background-color: var(--menu-dark);
      font-size: 12.5px;
      font-weight: 400;
      color: var(--menu-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.1s ease;
    }

    .panel-preset-btn:active {
      transform: scale(0.96);
    }

    .panel-preset-btn.active {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    /* Shared Save Button Styling (#cfd2da / #121316) matching pressed Tier-2 pills */
    .save-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 13px;
      border-radius: var(--radius-pill);
      background-color: var(--save-bg);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--save-fg);
      white-space: nowrap;
      transition: opacity 0.14s ease, transform 0.1s ease, background-color 0.14s ease;
    }

    .save-btn:active {
      opacity: 0.85;
      transform: scale(0.96);
    }

    .save-btn.saved {
      background-color: #e6e8ee;
      color: var(--save-fg);
    }

    .panel-field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .panel-field-label {
      width: 56px;
      flex-shrink: 0;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-level);
      white-space: nowrap;
    }

    .panel-select-btn {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      border-radius: 11px;
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-size: 14.5px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background-color 0.14s ease;
    }

    .panel-select-btn span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-select-btn:active,
    .panel-select-btn.open {
      background-color: var(--composer-btn);
    }

    .panel-select-btn .chev {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: var(--text-chevron);
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.16s ease;
    }

    .panel-select-btn.open .chev {
      transform: rotate(180deg);
    }

    .vp-sliders {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 2px 0;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-level);
      font-variant-numeric: tabular-nums;
    }

    .slider-head strong {
      color: var(--menu-active-text);
      font-weight: 500;
    }

    input[type="range"].mono-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--surface-composer);
      outline: none;
    }

    input[type="range"].mono-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--menu-active-text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }

    /* Darker STT & Morph Sub-Section (#15161a, 12px radius, 10px padding) */
    .audio-sub-section {
      background-color: var(--menu-dark);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audio-sub-section .panel-select-btn {
      background-color: var(--menu-bg);
      height: 36px;
    }

    .audio-sub-section .panel-select-btn:active,
    .audio-sub-section .panel-select-btn.open {
      background-color: var(--surface-composer);
    }

    /* AI Persona Panel Inputs (#15161a, >= 16px) */
    .persona-name-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border-radius: 11px;
      background-color: var(--menu-dark);
      color: var(--text-input);
      caret-color: var(--text-input);
      font-size: 16px !important;
      line-height: 1.3;
    }

    .persona-name-input::placeholder {
      color: var(--text-placeholder);
    }

    .persona-textarea-wrap {
      position: relative;
      width: 100%;
      background-color: var(--menu-dark);
      border-radius: 12px;
    }

    .persona-textarea {
      width: 100%;
      min-height: 112px;
      max-height: 200px;
      padding: 10px 34px 10px 12px;
      background: transparent;
      color: var(--text-input);
      caret-color: var(--text-input);
      font-size: 16px !important;
      line-height: 1.44;
      resize: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: block;
    }

    .persona-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .persona-clear-btn {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-clear-x);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, color 0.12s ease;
    }

    .persona-textarea-wrap.has-text .persona-clear-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .persona-clear-btn:active {
      color: var(--menu-active-text);
    }

    .persona-clear-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       4D. FLOATING COMPOSER CAPSULE (#2e3038, 50px #3e414c BUTTONS)
       ========================================================================== */
    .composer-capsule {
      pointer-events: auto;
      margin: 0 10px;
      min-height: 72px;
      border-radius: 36px;
      background-color: var(--surface-composer);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.65);
      padding: 11px;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px 50px;
      grid-template-areas: "plus input mic send";
      align-items: center;
      gap: 8px;
      transition:
        border-radius 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        padding 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .composer-capsule.is-expanded {
      border-radius: 26px;
      padding: 13px 11px 10px;
      grid-template-columns: 50px minmax(0, 1fr) 50px 50px;
      grid-template-rows: auto 50px;
      grid-template-areas:
        "input input input input"
        "plus  .     mic   send";
      row-gap: 10px;
      column-gap: 8px;
      align-items: center;
    }

    .cap-btn.plus-btn { grid-area: plus; }
    .cap-btn.mic-btn  { grid-area: mic; }
    .cap-btn.send-btn { grid-area: send; }

    .composer-input-wrap {
      grid-area: input;
      position: relative;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .composer-capsule.is-expanded .composer-input-wrap {
      padding: 0 5px;
      align-items: flex-start;
    }

    .cap-btn {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      border-radius: 50%;
      background-color: var(--composer-btn);
      color: var(--text-btn-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.1s ease, opacity 0.16s ease;
    }

    .cap-btn:active {
      background-color: var(--composer-btn-active);
      transform: scale(0.92);
    }

    .cap-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.95;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cap-btn.mic-btn.recording {
      background-color: var(--mic-rec-bg);
      color: var(--text-bright);
      box-shadow: 0 0 0 3px rgba(240, 93, 98, 0.28);
      animation: micPulseRed 1.15s ease-in-out infinite;
    }

    @keyframes micPulseRed {
      0%, 100% { box-shadow: 0 0 0 2px rgba(240, 93, 98, 0.22); }
      50% { box-shadow: 0 0 0 6px rgba(240, 93, 98, 0.46); }
    }

    .cap-btn.mic-btn.transcribing {
      background-color: var(--mic-transcribing-bg);
      color: var(--text-header);
    }

    .mic-spinner-svg {
      width: 22px;
      height: 22px;
      animation: orbitSpin 0.85s linear infinite;
    }

    .cap-btn.send-btn.ready {
      background-color: var(--send-ready-bg);
      color: var(--text-bright);
    }

    .cap-btn.send-btn.streaming {
      background-color: var(--send-stop-bg);
      color: var(--text-bright);
    }

    .chat-textarea {
      width: 100%;
      font-size: 18px !important;
      font-weight: 400;
      line-height: 1.38;
      padding: 0 4px;
      min-height: 25px;
      max-height: 156px;
      resize: none;
      color: var(--text-input);
      caret-color: var(--text-input);
      overflow-y: hidden;
      letter-spacing: -0.005em;
      display: block;
    }

    .composer-capsule.is-expanded .chat-textarea {
      padding: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .composer-input-wrap.has-text .chat-textarea {
      padding-right: 28px;
    }

    .chat-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .clear-input-btn {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-clear-x);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, color 0.12s ease;
    }

    .composer-input-wrap.has-text .clear-input-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .composer-capsule.is-expanded .clear-input-btn {
      right: 2px;
      top: auto;
      bottom: 4px;
      transform: none;
    }

    .clear-input-btn:active {
      color: var(--text-header);
    }

    .clear-input-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mic-status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: var(--text-input);
      font-variant-numeric: tabular-nums;
      padding-left: 4px;
      min-width: 0;
      width: 100%;
    }

    .mic-status-bar.active {
      display: flex;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background-color: var(--rec-red);
      animation: blink 1s infinite;
    }

    .rec-dot.hidden {
      display: none;
    }

    .rec-hint {
      font-size: 14px;
      color: #b4b9c4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ==========================================================================
       5. LEFT DRAWER (#111113, ZERO BORDERS, NO BOTTOM FOOTER)
       ========================================================================== */
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 80;
      width: min(84vw, 330px);
      background-color: var(--bg-drawer);
      box-shadow: 16px 0 48px rgba(0, 0, 0, 0.78);
      transform: translateX(-104%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-top: calc(var(--safe-top) + 10px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-top-bar {
      flex-shrink: 0;
      padding: 2px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-brand {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-header);
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
    }

    .drawer-brand span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-level);
      margin-left: 7px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-drawer-plaque);
    }

    .drawer-close-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      background-color: var(--bg-header-btn);
      color: var(--text-header);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, transform 0.1s ease;
    }

    .drawer-close-btn:active {
      background-color: var(--bg-header-btn-active);
      transform: scale(0.92);
    }

    .drawer-close-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drawer-content {
      flex-shrink: 0;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Silent Segmented Switch: OpenRouter | Direct / Custom */
    .segmented-ctrl {
      flex-shrink: 0;
      background-color: var(--bg-drawer-plaque);
      border-radius: var(--radius-pill);
      padding: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    .seg-btn {
      height: 34px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-level);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .seg-btn.active {
      background-color: var(--bg-drawer-tab-active);
      color: var(--text-header);
    }

    /* Collapsible Unclipped API Keys Accordion */
    .drawer-section-card {
      flex-shrink: 0;
      background-color: var(--bg-drawer-plaque);
      border-radius: 16px;
    }

    .accordion-trigger {
      width: 100%;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-header);
    }

    .accordion-trigger .chev {
      width: 14px;
      height: 14px;
      color: var(--text-level);
      transition: transform 0.2s ease;
    }

    .accordion-trigger.open .chev {
      transform: rotate(180deg);
    }

    .accordion-collapse {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .accordion-collapse.open {
      grid-template-rows: 1fr;
    }

    .accordion-inner {
      overflow: hidden;
      min-height: 0;
    }

    .accordion-body {
      padding: 2px 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-level);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background-color: var(--bg-drawer-input);
      border-radius: 11px;
      padding: 0 8px 0 11px;
      height: 40px;
    }

    .input-wrap input {
      flex: 1;
      min-width: 0;
      color: var(--text-header);
    }

    .input-wrap input::placeholder {
      color: var(--text-dim);
    }

    .eye-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-level);
      flex-shrink: 0;
    }

    /* Chat History + Dual-Zone Scroll (75dvh) */
    .chat-list-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-list-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0 2px 4px;
    }

    .chat-list-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .drawer-list-title {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-level);
    }

    .sel-count-badge {
      display: none;
      min-width: 20px;
      height: 18px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-drawer-tab-active);
      color: var(--text-header);
      font-size: 11px;
      font-weight: 600;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .sel-count-badge.visible {
      display: inline-flex;
    }

    .chat-bulk-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 3px;
    }

    .bulk-ico-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-level);
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.1s ease;
    }

    .bulk-ico-btn:active {
      background-color: var(--bg-drawer-tab-active);
      transform: scale(0.92);
    }

    .bulk-ico-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bulk-ico-btn.trash-btn {
      color: var(--text-disabled);
    }

    .bulk-ico-btn.trash-btn.has-selection {
      color: var(--text-bright);
      background-color: var(--bg-drawer-tab-active);
    }

    .chat-list {
      max-height: 75dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-bottom: 6px;
    }

    .chat-item {
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-radius: 12px;
      background-color: transparent;
      overflow: hidden;
      touch-action: pan-y;
      transition: background-color 0.14s ease;
    }

    .chat-item.active { background-color: var(--bg-drawer-row-active); }
    .chat-item.selected { background-color: var(--bg-drawer-row-selected); }
    .chat-item.context-highlight { background-color: var(--bg-drawer-row-ctx); }

    .chat-item-main {
      flex: 1;
      min-width: 0;
      padding: 8px 4px 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      text-align: left;
      touch-action: pan-y;
    }

    .chat-item-main:active { opacity: 0.78; }

    .chat-title {
      font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.28;
      font-weight: 500;
      letter-spacing: -0.008em;
      color: #f1f3f6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item-meta {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 400;
      color: var(--text-meta);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-rename-input {
      width: 100%;
      padding: 3px 8px;
      border-radius: 8px;
      background-color: var(--bg-drawer-tab-active);
      color: var(--menu-active-text);
      font-size: 16px !important;
      line-height: 1.25;
      font-weight: 500;
    }

    .chat-pin-indicator {
      flex-shrink: 0;
      width: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-level);
      pointer-events: none;
    }

    .chat-pin-indicator svg {
      width: 11.5px;
      height: 11.5px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(35deg);
    }

    /* Right Swipe-Select Column: 36px wide, touch-action: none */
    .chat-check-col {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
    }

    .ios-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--bg-checkbox-off);
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background-color 160ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .ios-checkbox svg {
      width: 10px;
      height: 10px;
      stroke: var(--pill-light-text);
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.45);
      transition:
        opacity 140ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chat-item.selected .ios-checkbox {
      background-color: var(--pill-light-bg);
      transform: scale(1.06);
    }

    .chat-item.selected .ios-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .chat-list-empty {
      padding: 18px 8px;
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ==========================================================================
       BORDERLESS LONG-PRESS CONTEXT MENU (ПЕРЕИМЕНОВАТЬ + PIN)
       ========================================================================== */
    .ctx-backdrop {
      position: absolute;
      inset: 0;
      z-index: 85;
      background: rgba(0, 0, 0, 0.34);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .ctx-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ctx-menu {
      position: absolute;
      z-index: 90;
      width: 198px;
      padding: 5px;
      background-color: var(--bg-ctx-menu);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.82);
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transform: translateY(-4px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }

    .ctx-menu.drop-up {
      transform: translateY(4px) scale(0.96);
    }

    .ctx-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .ctx-item {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14.5px;
      font-weight: 400;
      color: var(--text-header);
      text-align: left;
      transition: background-color 0.12s ease;
    }

    .ctx-item:active { background-color: var(--bg-surface-hover); }

    .ctx-item-left {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .ctx-item svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .ctx-pin-box {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background-color: #343740;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease;
    }

    .ctx-pin-box svg {
      width: 11px;
      height: 11px;
      stroke: var(--pill-light-text);
      stroke-width: 2.8;
      opacity: 0;
    }

    .ctx-item.is-pinned .ctx-pin-box {
      background-color: var(--pill-light-bg);
    }

    .ctx-item.is-pinned .ctx-pin-box svg {
      opacity: 1;
    }

    /* ==========================================================================
       BORDERLESS TOAST (NO alert() / confirm())
       ========================================================================== */
    .toast {
      position: absolute;
      left: 50%;
      bottom: calc(max(20px, env(safe-area-inset-bottom, 0px)) + 168px);
      transform: translateX(-50%) translateY(10px);
      z-index: 95;
      background-color: #282b33;
      color: var(--text-header);
      font-size: 13px;
      padding: 8px 15px;
      border-radius: var(--radius-pill);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.78);
      white-space: nowrap;
      max-width: calc(100% - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* === NEW LOGIC STYLES === */
    .mdd-status-row {
      padding: 6px 12px 4px;
      font-size: 12px;
      line-height: 1.3;
      color: var(--text-meta);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .mdd-refresh-btn {
      font-size: 12px;
      color: var(--text-level);
      padding: 2px 6px;
      border-radius: 6px;
      background-color: var(--menu-dark);
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .mdd-refresh-btn:active {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
    }

    .mdd-thinking-btn.is-disabled {
      color: var(--text-disabled);
      pointer-events: none;
    }

    .mdd-thinking-btn.is-disabled .mdd-thinking-chev {
      opacity: 0.35;
    }

    .msg-error-card {
      padding: 10px 13px;
      border-radius: 14px;
      background-color: #251719;
      color: #f2b8bc;
      font-size: 14.5px;
      line-height: 1.45;
      word-break: break-word;
    }

    .code-block-wrap {
      margin: 10px 0;
      border-radius: 12px;
      background-color: var(--bg-code);
      overflow: hidden;
    }

    .code-block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px 6px 12px;
      background-color: #16171a;
      font-size: 12px;
      color: var(--text-level);
    }

    .code-copy-btn {
      font-size: 12px;
      color: var(--menu-text);
      padding: 3px 8px;
      border-radius: 7px;
      background-color: var(--menu-bg);
    }

    .code-copy-btn:active {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
    }

    .ai-content pre {
      margin: 0;
      padding: 10px 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .ai-content pre code {
      display: block;
      padding: 0;
      background: transparent;
      border-radius: 0;
      font-size: 13.5px;
      line-height: 1.48;
      white-space: pre;
    }

    .stats-table-scroll {
      max-height: 36dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">

    <!-- =====================================================================
         1. SINGLE-ROW TOP HEADER
         ===================================================================== -->
    <header class="top-header" id="topHeader">
      <button class="hdr-circle-btn" id="btn-menu" aria-label="Меню">
        <svg viewBox="0 0 24 24">
          <line x1="4" y1="9" x2="20" y2="9"></line>
          <line x1="4" y1="15" x2="20" y2="15"></line>
        </svg>
      </button>

      <div class="header-center">
        <button class="gemini-model-trigger" id="modelDropdownBtn" data-popover="model" aria-label="Выбрать модель">
          <span class="gmt-model" id="modelBtnLabel">4 Argon</span>
          <span class="gmt-level" id="thinkingBtnLabel">High</span>
          <svg class="gmt-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>

      <button class="hdr-circle-btn" id="btn-new-chat" aria-label="Новый чат">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
      </button>
    </header>

    <!-- =====================================================================
         3. CHAT FEED (SEAMLESS #000000)
         ===================================================================== -->
    <main class="chat-feed" id="chatFeed"></main>

    <!-- Click-outside scrim for bottom panels (z-index: 40, strictly BELOW .bottom-dock) -->
    <div class="dock-scrim" id="dockScrim"></div>

    <!-- =====================================================================
         4. TRANSPARENT FLOATING BOTTOM DOCK (z-index: 50)
         ===================================================================== -->
    <section class="bottom-dock" id="bottomDock">
      <!-- Centered 38x38 Scroll-to-Bottom Button -->
      <button class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="Прокрутить вниз">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="6 13 12 19 18 13"></polyline>
        </svg>
      </button>

      <!-- 4A. TIER-2 ROW: [Persona 50px + Speaker 44px] | [Audio Scrub Bar] | [Hands Free + Auto TTS] -->
      <div class="tier2-row" id="tier2Row">
        <div class="t2-agent-pair">
          <button class="tier2-btn t2-persona" id="personaDockBtn" aria-label="AI Persona">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8.5" r="4"></circle>
              <path d="M4.5 20c1.2-3.6 4.1-5.5 7.5-5.5s6.3 1.9 7.5 5.5"></path>
            </svg>
          </button>

          <button class="tier2-btn t2-audio" id="audioDockBtn" aria-label="Настройки озвучки и микрофона">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M18.6 5.4a9 9 0 0 1 0 13.2"></path>
            </svg>
          </button>
        </div>

        <div class="t2-scrub-bar" id="ttsScrubBar" role="group" aria-label="Прогресс озвучки">
          <div class="t2-scrub-buffered" id="ttsScrubBuffered"></div>
          <div class="t2-scrub-fill" id="ttsScrubFill"></div>
          <div class="t2-scrub-controls">
            <button class="t2-scrub-btn" id="scrubRewindBtn" type="button" aria-label="Перемотать назад">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="11 19 2 12 11 5 11 19"></polygon>
                <polygon points="22 19 13 12 22 5 22 19"></polygon>
              </svg>
            </button>
            <button class="t2-scrub-btn t2-scrub-play" id="scrubPlayBtn" type="button" aria-label="Воспроизвести / пауза">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
            </button>
            <button class="t2-scrub-btn" id="scrubForwardBtn" type="button" aria-label="Перемотать вперёд">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="13 19 22 12 13 5 13 19"></polygon>
                <polygon points="2 19 11 12 2 5 2 19"></polygon>
              </svg>
            </button>
          </div>
        </div>

        <div class="t2-modes-pair">
          <button class="tier2-btn t2-mode-pill t2-handsfree" id="handsFreeBtn" type="button" aria-pressed="false" aria-label="Hands Free">
            <span class="t2-mode-label">Hands<br>Free</span>
          </button>

          <button class="tier2-btn t2-mode-pill t2-autotts" id="autoTtsBtn" type="button" aria-pressed="false" aria-label="Auto TTS">
            <span class="t2-mode-label">Auto<br>TTS</span>
          </button>
        </div>
      </div>

      <!-- 4D. FLOATING COMPOSER CAPSULE (#2e3038, 50px #3e414c buttons) -->
      <div class="composer-capsule" id="composerCapsule">
        <button class="cap-btn plus-btn" id="attachBtn" aria-label="Прикрепить">
          <svg viewBox="0 0 24 24">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>

        <div class="composer-input-wrap" id="composerInputWrap">
          <textarea class="chat-textarea" id="chatInput" rows="1" placeholder="Сообщение..."></textarea>
          <button class="clear-input-btn" id="btn-clear-input" type="button" aria-label="Очистить поле ввода">
            <svg viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
          <div class="mic-status-bar" id="micStatusBar">
            <span class="rec-dot" id="recDot"></span>
            <span id="micStatusTimer">0:00</span>
            <span class="rec-hint" id="micStatusHint">Запись…</span>
          </div>
        </div>

        <button class="cap-btn mic-btn" id="btn-mic" aria-label="Микрофон">
          <svg id="micIconSvg" viewBox="0 0 24 24">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>

        <button class="cap-btn send-btn" id="btn-send" aria-label="Отправить">
          <svg id="sendIconSvg" viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="6 11 12 5 18 11"></polyline>
          </svg>
        </button>
      </div>
    </section>

    <!-- =====================================================================
         DECOUPLED FLOATING OVERLAY PANELS LAYER (z-index: 55)
         ===================================================================== -->
    <div class="floating-panels-layer" id="floatingPanelsLayer">
      <!-- 4B. Audio (Voice & Mic) Panel (#1e1f24) -->
      <div class="slide-panel" id="audioPanel" role="dialog" aria-label="Настройки озвучки и микрофона">
        <div class="panel-presets-row" id="voicePresetGroup">
          <button class="panel-preset-btn active" data-voice-preset="Voice 1">Voice 1</button>
          <button class="panel-preset-btn" data-voice-preset="Voice 2">Voice 2</button>
          <button class="panel-preset-btn" data-voice-preset="Voice 3">Voice 3</button>
          <button class="panel-preset-btn" data-voice-preset="Voice 4">Voice 4</button>
          <button class="save-btn" id="saveVoicePresetBtn">Save</button>
        </div>

        <div class="panel-field-row">
          <span class="panel-field-label">TTS:</span>
          <button class="panel-select-btn" id="ttsSelectBtn" data-popover="tts">
            <span id="ttsSelectLabel">Gemini 3.8 Flash-Lite TTS</span>
            <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>

        <div class="panel-field-row">
          <span class="panel-field-label">Voice:</span>
          <button class="panel-select-btn" id="voiceSelectBtn" data-popover="voice">
            <span id="voiceSelectLabel">Puck</span>
            <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>

        <div class="vp-sliders">
          <div class="slider-group">
            <div class="slider-head">
              <span>Speed</span>
              <strong id="speedVal">1.15x</strong>
            </div>
            <input type="range" class="mono-range" id="speedSlider" min="0.70" max="1.60" step="0.05" value="1.15">
          </div>
          <div class="slider-group">
            <div class="slider-head">
              <span>Pitch</span>
              <strong id="pitchVal">1.00x</strong>
            </div>
            <input type="range" class="mono-range" id="pitchSlider" min="0.75" max="1.25" step="0.01" value="1.00">
          </div>
        </div>

        <div class="audio-sub-section">
          <div class="panel-field-row">
            <span class="panel-field-label">STT:</span>
            <button class="panel-select-btn" id="sttSelectBtn" data-popover="stt">
              <span id="sttSelectLabel">Whisper Large v3</span>
              <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
          </div>
          <div class="panel-field-row">
            <span class="panel-field-label">Morph:</span>
            <button class="panel-select-btn" id="morphSelectBtn" data-popover="morph">
              <span id="morphSelectLabel">Off</span>
              <svg class="chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 4C. AI Persona Panel (#1e1f24) -->
      <div class="slide-panel" id="personaPanel" role="dialog" aria-label="AI Persona">
        <div class="panel-presets-row" id="personaPresetGroup">
          <button class="panel-preset-btn active" data-persona-preset="0">Persona 1</button>
          <button class="panel-preset-btn" data-persona-preset="1">Persona 2</button>
          <button class="panel-preset-btn" data-persona-preset="2">Persona 3</button>
          <button class="panel-preset-btn" data-persona-preset="3">Persona 4</button>
