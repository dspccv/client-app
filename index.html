<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenRouter">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>OpenRouter · PWA Client</title>

  <!-- Separate Google Fonts links: Google Sans, Google Sans Code, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       SHARED DESIGN TOKENS — Pure Flat Borderless Monochrome Dark Theme
       ZERO borders and ZERO outlines anywhere across the entire application
       ========================================================================== */
    :root {
      --bg: #000000;
      --menu-bg: #1e1f24;
      --menu-dark: #15161a;
      --surface-composer: #2e3038;
      --composer-btn: #3e414c;
      --save-bg: #cfd2da;
      --save-fg: #121316;
      --menu-item-h: 44px;

      --menu-text: #c4c7ce;
      --menu-active-text: #f1f3f6;
      --menu-font-size: 15px;

      --bg-code: #1e1f20;
      --bg-header-btn: #222428;
      --bg-header-btn-active: #30333a;
      --bg-surface-hover: #353842;

      --composer-btn-active: #4b4f5c;
      --send-ready-bg: #575c69;
      --send-stop-bg: #6b2b30;
      --mic-rec-bg: #7a292e;
      --mic-transcribing-bg: #474b57;

      --bg-drawer: #111113;
      --bg-drawer-plaque: #1a1b1f;
      --bg-drawer-tab-active: #2d3036;
      --bg-drawer-input: #111113;
      --bg-drawer-row-active: #1c1e22;
      --bg-drawer-row-selected: #24272d;
      --bg-drawer-row-ctx: #2a2d35;
      --bg-checkbox-off: #2a2c32;
      --bg-ctx-menu: #222428;

      --bg-scroll-btn: #2b2e34;
      --bg-scroll-btn-active: #3a3e47;

      --text-bright: #ffffff;
      --text-header: #e3e3e3;
      --text-chat: #d3d5d9;
      --text-input: #c8cbd0;
      --text-placeholder: #7a7e86;
      --text-btn-bright: #f0f2f5;
      --text-code: #c4c7c5;
      --text-chevron: #c4c7c5;
      --text-thinking: #a8abb0;
      --text-level: #8e9196;
      --text-clear-x: #848891;
      --text-meta: #6e717a;
      --text-dim: #58585e;
      --text-disabled: #5a5d66;

      --pill-light-bg: #e3e3e3;
      --pill-light-text: #111215;
      --rec-red: #f05d62;

      --radius-pill: 9999px;
      --radius-card: 20px;
      --radius-popover: 18px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);

      --font-sans: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Google Sans Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* ==========================================================================
       GLOBAL ZERO-BORDER & iOS LONG-PRESS SELECTION LOCK
       ========================================================================== */
    html, body, *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none;
      outline: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* Allow selection ONLY inside .msg-body when the drawer is closed */
    body:not(.drawer-open) .msg-body,
    body:not(.drawer-open) .msg-body * {
      -webkit-user-select: text;
      user-select: text;
      -webkit-touch-callout: default;
    }

    /* Completely suppress selection inside and outside drawer while drawer is open */
    body.drawer-open .app-shell,
    body.drawer-open .chat-feed,
    body.drawer-open .drawer-backdrop,
    body.drawer-open .msg-body,
    body.drawer-open .msg-body * {
      -webkit-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body.drawer-open .drawer input,
    body.drawer-open .drawer textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
      -webkit-touch-callout: default !important;
    }

    /* ==========================================================================
       FULL-APP UI LOCK DURING MIC RECORDING & TRANSCRIPTION
       ========================================================================== */
    body.mic-recording .top-header,
    body.mic-recording .chat-feed,
    body.mic-recording .scroll-bottom-btn,
    body.mic-recording .tier2-row,
    body.mic-recording .floating-panels-layer,
    body.mic-recording .dock-scrim,
    body.mic-recording .plus-btn,
    body.mic-recording .composer-input-wrap,
    body.mic-recording .send-btn,
    body.mic-recording .drawer,
    body.mic-recording .drawer-backdrop,
    body.mic-transcribing .top-header,
    body.mic-transcribing .chat-feed,
    body.mic-transcribing .scroll-bottom-btn,
    body.mic-transcribing .tier2-row,
    body.mic-transcribing .floating-panels-layer,
    body.mic-transcribing .dock-scrim,
    body.mic-transcribing .plus-btn,
    body.mic-transcribing .composer-input-wrap,
    body.mic-transcribing .send-btn,
    body.mic-transcribing .drawer,
    body.mic-transcribing .drawer-backdrop {
      pointer-events: none !important;
    }

    body.mic-recording .top-header,
    body.mic-recording .tier2-row,
    body.mic-recording .scroll-bottom-btn,
    body.mic-recording .plus-btn,
    body.mic-recording .send-btn,
    body.mic-recording .msg-footer,
    body.mic-transcribing .top-header,
    body.mic-transcribing .tier2-row,
    body.mic-transcribing .scroll-bottom-btn,
    body.mic-transcribing .plus-btn,
    body.mic-transcribing .send-btn,
    body.mic-transcribing .msg-footer {
      opacity: 0.35;
      transition: opacity 0.16s ease;
    }

    body.mic-recording #btn-mic {
      pointer-events: auto !important;
      opacity: 1 !important;
    }

    body.mic-transcribing #btn-mic {
      pointer-events: none !important;
      cursor: default;
    }

    /* ==========================================================================
       BASE & iOS PWA GEOMETRY
       ========================================================================== */
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text-chat);
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.52;
      font-weight: 400;
      letter-spacing: -0.005em;
      font-optical-sizing: auto;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button {
      font-family: var(--font-sans);
      font-optical-sizing: auto;
      color: inherit;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    /* Strictly >= 16px on all inputs/textareas to prevent iOS Safari zoom */
    input {
      font-family: var(--font-sans);
      font-optical-sizing: auto;
      font-size: 16px !important;
      color: var(--text-input);
      caret-color: var(--text-input);
      background: transparent;
      border: none;
      outline: none;
      -webkit-font-smoothing: antialiased;
    }

    textarea {
      font-family: var(--font-sans);
      font-optical-sizing: auto;
      font-size: 16px;
      color: var(--text-input);
      caret-color: var(--text-input);
      background: transparent;
      border: none;
      outline: none;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 100dvh;
      margin: 0 auto;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 520px) {
      .app-shell {
        max-width: 390px;
        box-shadow: 0 0 72px rgba(255, 255, 255, 0.05), 0 0 48px rgba(0, 0, 0, 0.9);
      }
    }

    /* ==========================================================================
       1. SINGLE-ROW TOP HEADER (Menu | Centered Model+Level | New Chat)
       ========================================================================== */
    .top-header {
      position: relative;
      z-index: 30;
      flex-shrink: 0;
      background-color: var(--bg);
      padding: max(10px, var(--safe-top)) 12px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .hdr-circle-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      background-color: var(--bg-header-btn);
      color: var(--text-header);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, transform 0.1s ease;
    }

    .hdr-circle-btn:active {
      background-color: var(--bg-header-btn-active);
      transform: scale(0.93);
    }

    .hdr-circle-btn svg {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-center {
      flex: 1;
      min-width: 0;
      margin: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gemini-model-trigger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      padding: 6px 10px;
      border-radius: 12px;
      line-height: 1.2;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 0.12s ease;
    }

    .gemini-model-trigger:active {
      opacity: 0.65;
    }

    .gmt-model {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-header);
      letter-spacing: -0.012em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .gmt-level {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-level);
      letter-spacing: -0.012em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .gmt-level.hidden {
      display: none;
    }

    .gmt-chev {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      color: var(--text-chevron);
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      margin-left: -1px;
      transition: transform 0.16s ease;
    }

    .gemini-model-trigger.open .gmt-chev {
      transform: rotate(180deg);
    }

    /* ==========================================================================
       2. BORDERLESS POPOVERS & CENTER MODEL DROPDOWN (FIX #1a & #1b)
       ========================================================================== */
    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 58;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .popover-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .popover-menu {
      position: absolute;
      z-index: 60;
      min-width: 224px;
      max-width: calc(100% - 20px);
      max-height: 62dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--menu-bg);
      border-radius: var(--radius-popover);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.84);
      padding: 6px;
      opacity: 0;
      transform: translate3d(0, -6px, 0) scale(0.97);
      will-change: transform, opacity;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      pointer-events: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .popover-menu.drop-up {
      transform: translate3d(0, 6px, 0) scale(0.97);
    }

    .popover-menu.open {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
      pointer-events: auto;
    }

    /* FIX #1a: Full viewport-aware height so 5 models + Thinking + Flex never clip */
    .popover-menu.gemini-model-menu {
      width: 268px;
      min-width: 268px;
      max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 96px);
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      border-radius: 18px;
      padding: 8px;
    }

    .popover-menu.selector-menu {
      padding: 6px;
      overflow-x: hidden;
    }

    .mdd-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .model-opt {
      width: 100%;
      height: var(--menu-item-h);
      min-height: var(--menu-item-h);
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1.25;
      color: var(--menu-text);
      background-color: transparent;
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    /* Compact 42px model rows inside the center model dropdown */
    .gemini-model-menu .model-opt {
      height: 42px;
      min-height: 42px;
    }

    .model-opt span:first-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-opt:active {
      background-color: var(--bg-surface-hover);
    }

    .model-opt.selected {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    .mdd-check {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      color: var(--menu-active-text);
      opacity: 0;
    }

    .model-opt.selected .mdd-check {
      opacity: 1;
    }

    /* FIX #1b: Unified #15161a container wrapping Thinking title AND its options */
    .mdd-thinking-group {
      background-color: var(--menu-dark);
      border-radius: 12px;
      margin: 4px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .mdd-thinking-btn {
      width: 100%;
      height: 40px;
      min-height: 40px;
      padding: 0 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1.25;
      color: var(--menu-text);
      background-color: transparent;
      text-align: left;
      transition: background-color 0.12s ease;
    }

    .mdd-thinking-btn:active {
      background-color: rgba(255, 255, 255, 0.05);
    }

    .mdd-thinking-chev {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-chevron);
    }

    .mdd-thinking-chev svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .mdd-thinking-btn.expanded .mdd-thinking-chev svg {
      transform: rotate(90deg);
    }

    .mdd-thinking-current {
      margin-left: auto;
      font-size: 13px;
      color: var(--text-level);
    }

    /* Zero-bleed collapsed options grid (padding: 0, visibility: hidden, opacity: 0) */
    .mdd-thinking-panel {
      display: grid;
      grid-template-rows: 0fr;
      overflow: hidden;
      margin: 0;
      padding: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition:
        grid-template-rows 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.14s ease,
        visibility 0s linear 0.18s;
    }

    .mdd-thinking-panel.expanded {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition:
        grid-template-rows 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.14s ease,
        visibility 0s linear 0s;
    }

    .mdd-thinking-inner {
      overflow: hidden;
      min-height: 0;
      padding: 0;
      margin: 0;
    }

    .mdd-thinking-list {
      padding: 0 4px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mdd-think-opt {
      width: 100%;
      height: 36px;
      min-height: 36px;
      padding: 0 10px 0 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14.5px;
      color: var(--menu-text);
      background-color: transparent;
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .mdd-think-opt:active {
      background-color: var(--bg-surface-hover);
    }

    .mdd-think-opt.selected {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    .mdd-think-opt .mdd-check {
      width: 15px;
      height: 15px;
    }

    .mdd-think-opt.selected .mdd-check {
      opacity: 1;
    }

    /* Flat Flex row directly on #1e1f24 below the Thinking container */
    .mdd-flex-item {
      width: 100%;
      height: 42px;
      min-height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1.25;
      background-color: transparent;
      color: var(--menu-text);
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .mdd-flex-left {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .mdd-flex-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: currentColor;
      opacity: 0.85;
    }

    .mdd-flex-icon svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mdd-flex-item:active {
      background-color: var(--bg-surface-hover);
    }

    .mdd-flex-item.is-on {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    .mdd-flex-item.is-on .mdd-check {
      opacity: 1;
    }

    .mdd-flex-item.is-disabled {
      background-color: transparent;
      color: var(--text-disabled);
      pointer-events: none;
    }

    /* Compact Borderless ••• Message Info Popover */
    .popover-menu.info-popover {
      min-width: 196px;
      width: auto;
      padding: 10px 14px;
      border-radius: 14px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.84);
    }

    .info-pop-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .info-pop-time {
      font-size: 13px;
      line-height: 1.3;
      color: var(--text-header);
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }

    .info-pop-model {
      font-size: 13px;
      line-height: 1.3;
      color: var(--text-level);
      padding: 6px 8px;
      border-radius: 8px;
      background-color: var(--menu-dark);
      white-space: nowrap;
    }

    .info-pop-model strong {
      color: var(--menu-active-text);
      font-weight: 500;
    }

    /* ==========================================================================
       3. CHAT FEED & USER CARD (FIX #3: #1e1f24 USER CARD)
       ========================================================================== */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: var(--bg);
      padding: 8px 16px 205px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .chat-empty {
      margin: auto 0;
      text-align: center;
      padding: 40px 20px 120px;
      color: var(--text-dim);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .chat-empty-title {
      font-size: 19px;
      font-weight: 500;
      color: var(--text-level);
    }

    .msg-block {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* FIX #3: User message card matches previous Tier-2 surface (#1e1f24) */
    .msg-user-card {
      align-self: flex-end;
      max-width: 88%;
      background-color: var(--menu-bg);
      border-radius: var(--radius-card);
      padding: 13px 16px;
      transition: background-color 0.14s ease;
    }

    .msg-user-card.collapsed {
      cursor: pointer;
    }

    .msg-body {
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.52;
      font-weight: 400;
      letter-spacing: -0.005em;
      font-optical-sizing: auto;
      font-variation-settings: "opsz" 17;
      color: var(--text-chat);
      word-break: break-word;
    }

    .msg-user-card .msg-body {
      white-space: pre-wrap;
    }

    .ai-content {
      width: 100%;
    }

    .ai-content p + p,
    .ai-content p + ul,
    .ai-content ul + p {
      margin-top: 11px;
    }

    .ai-content ul {
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .ai-content strong {
      color: var(--text-header);
      font-weight: 500;
    }

    .msg-body code {
      font-family: var(--font-mono);
      font-size: 15px;
      background-color: var(--bg-code);
      color: var(--text-code);
      padding: 2px 6px;
      border-radius: 6px;
      letter-spacing: 0;
      font-variation-settings: normal;
    }

    .clamped {
      position: relative;
      max-height: calc(17px * 1.52 * 3);
      overflow: hidden;
    }

    /* Smooth bottom fade into #1e1f24 for collapsed user cards */
    .msg-user-card .clamped::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.75em;
      background: linear-gradient(180deg, rgba(30, 31, 36, 0) 0%, #1e1f24 92%);
      pointer-events: none;
    }

    /* Smooth bottom fade into #000000 for collapsed AI responses */
    .ai-content.clamped::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 1.75em;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, #000000 92%);
      pointer-events: none;
    }

    /* LIVE-ONLY Gemini 3-Dot Orbital Thinking Spinner */
    .live-thinking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0 6px;
    }

    .gemini-dot-spinner {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      position: relative;
      animation: orbitSpin 1.8s linear infinite;
    }

    .gemini-dot-spinner span {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background-color: #c4c7c5;
      animation: dotPulse 1.2s ease-in-out infinite;
    }

    .gemini-dot-spinner span:nth-child(1) { top: 1px; left: 7px; animation-delay: 0s; }
    .gemini-dot-spinner span:nth-child(2) { bottom: 2px; left: 2px; animation-delay: 0.4s; }
    .gemini-dot-spinner span:nth-child(3) { bottom: 2px; right: 2px; animation-delay: 0.8s; }

    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dotPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .live-thinking-text {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-thinking);
      letter-spacing: -0.005em;
      animation: thinkingFade 1.5s ease-in-out infinite;
    }

    @keyframes thinkingFade {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    .stream-cursor {
      display: inline-block;
      width: 7px;
      height: 17px;
      background: var(--text-level);
      vertical-align: -2px;
      margin-left: 3px;
      border-radius: 2px;
      animation: blink 0.85s infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0.15; }
    }

    /* Unified Right-Aligned 5-Icon Dim Footer (Copy -> Delete -> Speak -> ••• -> Collapse) */
    .msg-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-top: 6px;
      padding: 0 2px;
      min-height: 30px;
      width: 100%;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .msg-icon-btn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.14s ease, background-color 0.14s ease, transform 0.1s ease;
    }

    .msg-icon-btn:active {
      background-color: #1c1e22;
      color: var(--text-header);
      transform: scale(0.92);
    }

    .msg-icon-btn.active {
      color: var(--text-header);
    }

    .msg-icon-btn.speaking {
      color: var(--text-bright);
      animation: speakPulse 1.1s ease-in-out infinite;
    }

    @keyframes speakPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }

    .msg-icon-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .msg-icon-btn.collapse-btn.is-expanded svg {
      transform: rotate(180deg);
    }

    /* ==========================================================================
       4. TRANSPARENT FLOATING BOTTOM DOCK & DECOUPLED PANEL LAYERS
       ========================================================================== */
    .dock-scrim {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, 0.38);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .dock-scrim.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      background: transparent;
      pointer-events: none;
      padding-top: 4px;
      padding-bottom: calc(max(24px, env(safe-area-inset-bottom)) + 16px);
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 520px) {
      .bottom-dock {
        max-width: 390px;
        margin: 0 auto;
      }
    }

    /* Centered 38x38 Circular Scroll-to-Bottom Button */
    .scroll-bottom-btn {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--bg-scroll-btn);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.68);
      color: #e6e8ec;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px) scale(0.92);
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.14s ease;
    }

    .scroll-bottom-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0) scale(1);
    }

    .scroll-bottom-btn:active {
      background-color: var(--bg-scroll-btn-active);
      transform: translate(-50%, 0) scale(0.93);
    }

    .scroll-bottom-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       4A. TIER-2 ROW (FIX #2: #2e3038 OFF / #cfd2da + #121316 ACTIVE, ZERO FLICKER)
       ========================================================================== */
    .tier2-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      margin-bottom: 10px;
      width: 100%;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      contain: layout style;
    }

    .tier2-btn {
      pointer-events: auto;
      height: var(--menu-item-h);
      min-height: var(--menu-item-h);
      padding: 0 11px;
      border-radius: 9999px;
      background-color: var(--surface-composer);
      color: var(--menu-text);
      font-family: var(--font-sans);
      font-size: var(--menu-font-size);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.008em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.52);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    /* Pressed / active Tier-2 pills use IDENTICAL Save button colors (#cfd2da / #121316) */
    .tier2-btn.is-active {
      background-color: var(--save-bg);
      color: var(--save-fg);
      font-weight: 500;
    }

    /* Zero-height bold width reservation prevents horizontal micro-shift on 400 -> 500 */
    .t2-text {
      display: inline-block;
      line-height: 1.1;
      text-align: center;
    }

    .t2-text::after {
      content: attr(data-label);
      font-weight: 500;
      height: 0;
      overflow: hidden;
      visibility: hidden;
      display: block;
      pointer-events: none;
    }

    .t2-balance {
      margin-right: auto;
      font-variant-numeric: tabular-nums;
    }

    .t2-balance svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .t2-persona {
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
    }

    .t2-persona .t2-text {
      display: block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .t2-audio {
      gap: 3px;
    }

    .t2-audio svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .t2-audio-slash {
      opacity: 0.45;
      font-weight: 400;
      line-height: 1;
      margin: 0 1px;
    }

    .t2-autotts {
      flex-shrink: 0;
    }

    @media (max-width: 380px) {
      .tier2-row {
        padding: 0 8px;
        gap: 5px;
      }
      .tier2-btn {
        padding: 0 9.5px;
      }
    }

    /* ==========================================================================
       4B & 4C. DECOUPLED FLOATING OVERLAY PANELS LAYER (z-index: 55)
       ========================================================================== */
    .floating-panels-layer {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      z-index: 55;
      pointer-events: none;
      --panels-bottom: 166px;
    }

    @media (min-width: 520px) {
      .floating-panels-layer {
        max-width: 390px;
        margin: 0 auto;
      }
    }

    .slide-panel {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: var(--panels-bottom);
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: var(--menu-bg);
      border-radius: 20px;
      padding: 12px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.84);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate3d(0, 8px, 0);
      will-change: transform, opacity;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transition:
        opacity 0.16s ease,
        transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0.18s;
    }

    .slide-panel.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate3d(0, 0, 0);
      transition:
        opacity 0.16s ease,
        transform 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }

    .slide-panel.stats-panel {
      right: auto;
      width: 286px;
      max-width: calc(100% - 20px);
      padding: 12px 14px;
    }

    .stats-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .stats-top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .stats-balance-val {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-bright);
      font-variant-numeric: tabular-nums;
    }

    .stats-balance-lbl {
      font-size: 12px;
      color: var(--text-level);
    }

    .stats-limit-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stats-limit-head {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-level);
      font-variant-numeric: tabular-nums;
    }

    .stats-progress-track {
      width: 100%;
      height: 5px;
      border-radius: var(--radius-pill);
      background: var(--surface-composer);
      overflow: hidden;
    }

    .stats-progress-fill {
      height: 100%;
      background: var(--text-header);
      border-radius: var(--radius-pill);
    }

    .stats-quota-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 11px;
      background: var(--surface-composer);
      border-radius: 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .stats-table {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 11px;
      border-radius: 12px;
      background: var(--menu-dark);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stats-row-name {
      color: var(--text-header);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .stats-row-sub {
      color: var(--text-level);
      font-size: 12px;
    }

    .stats-row-val {
      color: var(--text-header);
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Preset Row: 4 equal-width buttons + Save */
    .panel-presets-row {
      display: flex;
      align-items: center;
      gap: 5px;
      width: 100%;
    }

    .panel-preset-btn {
      flex: 1;
      min-width: 0;
      height: 34px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      background-color: var(--menu-dark);
      font-size: 12.5px;
      font-weight: 400;
      color: var(--menu-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.1s ease;
    }

    .panel-preset-btn:active {
      transform: scale(0.96);
    }

    .panel-preset-btn.active {
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-weight: 500;
    }

    /* Shared Save Button Styling (#cfd2da / #121316) matching pressed Tier-2 pills */
    .save-btn {
      flex-shrink: 0;
      height: 34px;
      padding: 0 13px;
      border-radius: var(--radius-pill);
      background-color: var(--save-bg);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--save-fg);
      white-space: nowrap;
      transition: opacity 0.14s ease, transform 0.1s ease, background-color 0.14s ease;
    }

    .save-btn:active {
      opacity: 0.85;
      transform: scale(0.96);
    }

    .save-btn.saved {
      background-color: #e6e8ee;
      color: var(--save-fg);
    }

    .panel-field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .panel-field-label {
      width: 56px;
      flex-shrink: 0;
      font-size: 13.5px;
      font-weight: 400;
      color: var(--text-level);
      white-space: nowrap;
    }

    .panel-select-btn {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      border-radius: 11px;
      background-color: var(--surface-composer);
      color: var(--menu-active-text);
      font-size: 14.5px;
      font-weight: 400;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: background-color 0.14s ease;
    }

    .panel-select-btn span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-select-btn:active,
    .panel-select-btn.open {
      background-color: var(--composer-btn);
    }

    .panel-select-btn .chev {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      stroke: var(--text-chevron);
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.16s ease;
    }

    .panel-select-btn.open .chev {
      transform: rotate(180deg);
    }

    .vp-sliders {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 2px 0;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .slider-head {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      color: var(--text-level);
      font-variant-numeric: tabular-nums;
    }

    .slider-head strong {
      color: var(--menu-active-text);
      font-weight: 500;
    }

    input[type="range"].mono-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: var(--radius-pill);
      background: var(--surface-composer);
      outline: none;
    }

    input[type="range"].mono-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--menu-active-text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
      cursor: pointer;
    }

    /* Darker STT & Morph Sub-Section (#15161a, 12px radius, 10px padding) */
    .audio-sub-section {
      background-color: var(--menu-dark);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .audio-sub-section .panel-select-btn {
      background-color: var(--menu-bg);
      height: 36px;
    }

    .audio-sub-section .panel-select-btn:active,
    .audio-sub-section .panel-select-btn.open {
      background-color: var(--surface-composer);
    }

    /* AI Persona Panel Inputs (#15161a, >= 16px) */
    .persona-name-input {
      flex: 1;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      border-radius: 11px;
      background-color: var(--menu-dark);
      color: var(--text-input);
      caret-color: var(--text-input);
      font-size: 16px !important;
      line-height: 1.3;
    }

    .persona-name-input::placeholder {
      color: var(--text-placeholder);
    }

    .persona-textarea-wrap {
      position: relative;
      width: 100%;
      background-color: var(--menu-dark);
      border-radius: 12px;
    }

    .persona-textarea {
      width: 100%;
      min-height: 112px;
      max-height: 200px;
      padding: 10px 34px 10px 12px;
      background: transparent;
      color: var(--text-input);
      caret-color: var(--text-input);
      font-size: 16px !important;
      line-height: 1.44;
      resize: none;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      display: block;
    }

    .persona-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .persona-clear-btn {
      position: absolute;
      right: 6px;
      bottom: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-clear-x);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, color 0.12s ease;
    }

    .persona-textarea-wrap.has-text .persona-clear-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .persona-clear-btn:active {
      color: var(--menu-active-text);
    }

    .persona-clear-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ==========================================================================
       4D. FLOATING COMPOSER CAPSULE (#2e3038, 50px #3e414c BUTTONS)
       ========================================================================== */
    .composer-capsule {
      pointer-events: auto;
      margin: 0 10px;
      min-height: 72px;
      border-radius: 36px;
      background-color: var(--surface-composer);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.65);
      padding: 11px;
      display: grid;
      grid-template-columns: 50px minmax(0, 1fr) 50px 50px;
      grid-template-areas: "plus input mic send";
      align-items: center;
      gap: 8px;
      transition:
        border-radius 0.18s cubic-bezier(0.22, 1, 0.36, 1),
        padding 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .composer-capsule.is-expanded {
      border-radius: 26px;
      padding: 13px 11px 10px;
      grid-template-columns: 50px minmax(0, 1fr) 50px 50px;
      grid-template-rows: auto 50px;
      grid-template-areas:
        "input input input input"
        "plus  .     mic   send";
      row-gap: 10px;
      column-gap: 8px;
      align-items: center;
    }

    .cap-btn.plus-btn { grid-area: plus; }
    .cap-btn.mic-btn  { grid-area: mic; }
    .cap-btn.send-btn { grid-area: send; }

    .composer-input-wrap {
      grid-area: input;
      position: relative;
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .composer-capsule.is-expanded .composer-input-wrap {
      padding: 0 5px;
      align-items: flex-start;
    }

    .cap-btn {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      border-radius: 50%;
      background-color: var(--composer-btn);
      color: var(--text-btn-bright);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.1s ease, opacity 0.16s ease;
    }

    .cap-btn:active {
      background-color: var(--composer-btn-active);
      transform: scale(0.92);
    }

    .cap-btn svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.95;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cap-btn.mic-btn.recording {
      background-color: var(--mic-rec-bg);
      color: var(--text-bright);
      box-shadow: 0 0 0 3px rgba(240, 93, 98, 0.28);
      animation: micPulseRed 1.15s ease-in-out infinite;
    }

    @keyframes micPulseRed {
      0%, 100% { box-shadow: 0 0 0 2px rgba(240, 93, 98, 0.22); }
      50% { box-shadow: 0 0 0 6px rgba(240, 93, 98, 0.46); }
    }

    .cap-btn.mic-btn.transcribing {
      background-color: var(--mic-transcribing-bg);
      color: var(--text-header);
    }

    .mic-spinner-svg {
      width: 22px;
      height: 22px;
      animation: orbitSpin 0.85s linear infinite;
    }

    .cap-btn.send-btn.ready {
      background-color: var(--send-ready-bg);
      color: var(--text-bright);
    }

    .cap-btn.send-btn.streaming {
      background-color: var(--send-stop-bg);
      color: var(--text-bright);
    }

    .chat-textarea {
      width: 100%;
      font-size: 18px !important;
      font-weight: 400;
      line-height: 1.38;
      padding: 0 4px;
      min-height: 25px;
      max-height: 156px;
      resize: none;
      color: var(--text-input);
      caret-color: var(--text-input);
      overflow-y: hidden;
      letter-spacing: -0.005em;
      display: block;
    }

    .composer-capsule.is-expanded .chat-textarea {
      padding: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .composer-input-wrap.has-text .chat-textarea {
      padding-right: 28px;
    }

    .chat-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .clear-input-btn {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: transparent;
      color: var(--text-clear-x);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease, color 0.12s ease;
    }

    .composer-input-wrap.has-text .clear-input-btn {
      opacity: 1;
      pointer-events: auto;
    }

    .composer-capsule.is-expanded .clear-input-btn {
      right: 2px;
      top: auto;
      bottom: 4px;
      transform: none;
    }

    .clear-input-btn:active {
      color: var(--text-header);
    }

    .clear-input-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mic-status-bar {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      color: var(--text-input);
      font-variant-numeric: tabular-nums;
      padding-left: 4px;
      min-width: 0;
      width: 100%;
    }

    .mic-status-bar.active {
      display: flex;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background-color: var(--rec-red);
      animation: blink 1s infinite;
    }

    .rec-dot.hidden {
      display: none;
    }

    .rec-hint {
      font-size: 14px;
      color: #b4b9c4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ==========================================================================
       5. LEFT DRAWER (#111113, ZERO BORDERS, NO BOTTOM FOOTER)
       ========================================================================== */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0, 0, 0, 0.64);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 80;
      width: min(84vw, 330px);
      background-color: var(--bg-drawer);
      box-shadow: 16px 0 48px rgba(0, 0, 0, 0.78);
      transform: translateX(-104%);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      padding-top: calc(var(--safe-top) + 10px);
      padding-bottom: calc(var(--safe-bottom) + 16px);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-top-bar {
      flex-shrink: 0;
      padding: 2px 12px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-brand {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-header);
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
    }

    .drawer-brand span {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-level);
      margin-left: 7px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-drawer-plaque);
    }

    .drawer-close-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      background-color: var(--bg-header-btn);
      color: var(--text-header);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease, transform 0.1s ease;
    }

    .drawer-close-btn:active {
      background-color: var(--bg-header-btn-active);
      transform: scale(0.92);
    }

    .drawer-close-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drawer-content {
      flex-shrink: 0;
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Silent Segmented Switch: OpenRouter | Direct / Custom */
    .segmented-ctrl {
      flex-shrink: 0;
      background-color: var(--bg-drawer-plaque);
      border-radius: var(--radius-pill);
      padding: 3px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
    }

    .seg-btn {
      height: 34px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-level);
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .seg-btn.active {
      background-color: var(--bg-drawer-tab-active);
      color: var(--text-header);
    }

    /* Collapsible Unclipped API Keys Accordion */
    .drawer-section-card {
      flex-shrink: 0;
      background-color: var(--bg-drawer-plaque);
      border-radius: 16px;
    }

    .accordion-trigger {
      width: 100%;
      padding: 12px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-header);
    }

    .accordion-trigger .chev {
      width: 14px;
      height: 14px;
      color: var(--text-level);
      transition: transform 0.2s ease;
    }

    .accordion-trigger.open .chev {
      transform: rotate(180deg);
    }

    .accordion-collapse {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .accordion-collapse.open {
      grid-template-rows: 1fr;
    }

    .accordion-inner {
      overflow: hidden;
      min-height: 0;
    }

    .accordion-body {
      padding: 2px 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-level);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background-color: var(--bg-drawer-input);
      border-radius: 11px;
      padding: 0 8px 0 11px;
      height: 40px;
    }

    .input-wrap input {
      flex: 1;
      min-width: 0;
      color: var(--text-header);
    }

    .input-wrap input::placeholder {
      color: var(--text-dim);
    }

    .eye-btn {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-level);
      flex-shrink: 0;
    }

    /* Chat History + Dual-Zone Scroll (75dvh) */
    .chat-list-section {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-list-header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 0 2px 4px;
    }

    .chat-list-title-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .drawer-list-title {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-level);
    }

    .sel-count-badge {
      display: none;
      min-width: 20px;
      height: 18px;
      padding: 0 6px;
      border-radius: var(--radius-pill);
      background-color: var(--bg-drawer-tab-active);
      color: var(--text-header);
      font-size: 11px;
      font-weight: 600;
      align-items: center;
      justify-content: center;
      font-variant-numeric: tabular-nums;
    }

    .sel-count-badge.visible {
      display: inline-flex;
    }

    .chat-bulk-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 3px;
    }

    .bulk-ico-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-level);
      transition: background-color 0.14s ease, color 0.14s ease, transform 0.1s ease;
    }

    .bulk-ico-btn:active {
      background-color: var(--bg-drawer-tab-active);
      transform: scale(0.92);
    }

    .bulk-ico-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bulk-ico-btn.trash-btn {
      color: var(--text-disabled);
    }

    .bulk-ico-btn.trash-btn.has-selection {
      color: var(--text-bright);
      background-color: var(--bg-drawer-tab-active);
    }

    .chat-list {
      max-height: 75dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: pan-y;
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-bottom: 6px;
    }

    .chat-item {
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-radius: 12px;
      background-color: transparent;
      overflow: hidden;
      touch-action: pan-y;
      transition: background-color 0.14s ease;
    }

    .chat-item.active { background-color: var(--bg-drawer-row-active); }
    .chat-item.selected { background-color: var(--bg-drawer-row-selected); }
    .chat-item.context-highlight { background-color: var(--bg-drawer-row-ctx); }

    .chat-item-main {
      flex: 1;
      min-width: 0;
      padding: 8px 4px 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      text-align: left;
      touch-action: pan-y;
    }

    .chat-item-main:active { opacity: 0.78; }

    .chat-title {
      font-family: 'Google Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.28;
      font-weight: 500;
      letter-spacing: -0.008em;
      color: #f1f3f6;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-item-meta {
      font-size: 12px;
      line-height: 1.25;
      font-weight: 400;
      color: var(--text-meta);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-rename-input {
      width: 100%;
      padding: 3px 8px;
      border-radius: 8px;
      background-color: var(--bg-drawer-tab-active);
      color: var(--menu-active-text);
      font-size: 16px !important;
      line-height: 1.25;
      font-weight: 500;
    }

    .chat-pin-indicator {
      flex-shrink: 0;
      width: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-level);
      pointer-events: none;
    }

    .chat-pin-indicator svg {
      width: 11.5px;
      height: 11.5px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transform: rotate(35deg);
    }

    /* Right Swipe-Select Column: 36px wide, touch-action: none */
    .chat-check-col {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: none;
    }

    .ios-checkbox {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background-color: var(--bg-checkbox-off);
      display: flex;
      align-items: center;
      justify-content: center;
      transition:
        background-color 160ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .ios-checkbox svg {
      width: 10px;
      height: 10px;
      stroke: var(--pill-light-text);
      fill: none;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.45);
      transition:
        opacity 140ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .chat-item.selected .ios-checkbox {
      background-color: var(--pill-light-bg);
      transform: scale(1.06);
    }

    .chat-item.selected .ios-checkbox svg {
      opacity: 1;
      transform: scale(1);
    }

    .chat-list-empty {
      padding: 18px 8px;
      text-align: center;
      font-size: 13px;
      color: var(--text-dim);
    }

    /* ==========================================================================
       BORDERLESS LONG-PRESS CONTEXT MENU (ПЕРЕИМЕНОВАТЬ + PIN)
       ========================================================================== */
    .ctx-backdrop {
      position: fixed;
      inset: 0;
      z-index: 85;
      background: rgba(0, 0, 0, 0.34);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    .ctx-backdrop.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .ctx-menu {
      position: absolute;
      z-index: 90;
      width: 198px;
      padding: 5px;
      background-color: var(--bg-ctx-menu);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.82);
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      transform: translateY(-4px) scale(0.96);
      pointer-events: none;
      transition: opacity 0.14s ease, transform 0.14s ease;
    }

    .ctx-menu.drop-up {
      transform: translateY(4px) scale(0.96);
    }

    .ctx-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .ctx-item {
      width: 100%;
      padding: 11px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14.5px;
      font-weight: 400;
      color: var(--text-header);
      text-align: left;
      transition: background-color 0.12s ease;
    }

    .ctx-item:active { background-color: var(--bg-surface-hover); }

    .ctx-item-left {
      display: inline-flex;
      align-items: center;
      gap: 9px;
    }

    .ctx-item svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .ctx-pin-box {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background-color: #343740;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.14s ease;
    }

    .ctx-pin-box svg {
      width: 11px;
      height: 11px;
      stroke: var(--pill-light-text);
      stroke-width: 2.8;
      opacity: 0;
    }

    .ctx-item.is-pinned .ctx-pin-box {
      background-color: var(--pill-light-bg);
    }

    .ctx-item.is-pinned .ctx-pin-box svg {
      opacity: 1;
    }

    /* ==========================================================================
       BORDERLESS TOAST (NO alert() / confirm())
       ========================================================================== */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(max(24px, env(safe-area-inset-bottom)) + 160px);
      transform: translateX(-50%) translateY(10px);
      z-index: 95;
      background-color: #282b33;
      color: var(--text-header);
      font-size: 13px;
      padding: 8px 15px;
      border-radius: var(--radius-pill);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.78);
      white-space: nowrap;
      max-width: calc(100% - 28px);
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app-shell" id="appShell">

    <!-- =====================================================================
         1. SINGLE-ROW TOP HEADER
         ===================================================================== -->
    <header class="top-header" id="topHeader">
      <button class="hdr-circle-btn" id="btn-menu" aria-label="Меню">
        <svg viewBox="0 0 24 24">
          <line x1="4" y1="9" x2="20" y2="9"></line>
          <line x1="4" y1="15" x2="20" y2="15"></line>
        </svg>
      </button>

      <div class="header-center">
        <button class="gemini-model-trigger" id="modelDropdownBtn" data-popover="model" aria-label="Выбрать модель">
          <span class="gmt-model" id="modelBtnLabel">4 Argon</span>
          <span class="gmt-level" id="thinkingBtnLabel">High</span>
          <svg class="gmt-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>

      <button class="hdr-circle-btn" id="btn-new-chat" aria-label="Новый чат">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
      </button>
    </header>

    <!-- =====================================================================
         3. CHAT FEED (SEAMLESS #000000)
         ===================================================================== -->
    <main class="chat-feed" id="chatFeed"></main>

    <!-- Click-outside scrim for bottom panels (z-index: 40, strictly BELOW .bottom-dock) -->
    <div class="dock-scrim" id="dockScrim"></div>

    <!-- =====================================================================
         4. TRANSPARENT FLOATING BOTTOM DOCK (z-index: 50)
         ===================================================================== -->
    <section class="bottom-dock" id="bottomDock">
      <!-- Centered 38x38 Scroll-to-Bottom Button -->
      <button class="scroll-bottom-btn" id="scrollBottomBtn" aria-label="Прокрутить вниз">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <polyline points="6 13 12 19 18 13"></polyline>
        </svg>
      </button>

      <!-- 4A. TIER-2 ROW (44px, 9999px pill radius, #2e3038 off / #cfd2da active, zero flicker) -->
      <div class="tier2-row" id="tier2Row">
        <button class="tier2-btn t2-balance" id="statsDropdownBtn" aria-label="Баланс и расходы">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M14.8 9.2c-.5-.8-1.5-1.2-2.7-1.2-1.5 0-2.6.8-2.6 1.9 0 1.2 1 1.7 2.6 2 1.7.3 2.8.9 2.8 2.1 0 1.2-1.2 2-2.9 2-1.3 0-2.4-.5-3-1.3"></path>
            <line x1="12" y1="6.3" x2="12" y2="8"></line>
            <line x1="12" y1="16" x2="12" y2="17.7"></line>
          </svg>
          <span class="t2-text" id="balanceBtnVal" data-label="0.000$">0.000$</span>
        </button>

        <button class="tier2-btn t2-persona" id="personaDockBtn" aria-label="AI Persona">
          <span class="t2-text" id="personaDockLabel" data-label="AI Persona">AI Persona</span>
        </button>

        <button class="tier2-btn t2-audio" id="audioDockBtn" aria-label="Настройки озвучки и микрофона">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span class="t2-audio-slash" aria-hidden="true">/</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
          </svg>
        </button>

        <button class="tier2-btn t2-autotts" id="autoTtsBtn" aria-pressed="false">
          <span class="t2-text" data-label="Auto TTS">Auto TTS</span>
        </button>
      </div>

      <!-- 4D. FLOATING COMPOSER CAPSULE (#2e3038, 50px #3e414c buttons) -->
      <div class="composer-capsule" id="composerCapsule">
        <button class="cap-btn plus-btn" id="attachBtn" aria-label="Прикрепить">

      function clearWindowSelection() {
        try {
          const sel = window.getSelection ? window.getSelection() : null;
          if (sel && sel.rangeCount > 0) sel.removeAllRanges();
        } catch (_) {}
      }

      function isEditableTarget(el) {
        if (!el) return false;
        const node = el.nodeType === 1 ? el : el.parentElement;
        if (!node) return false;
        return node.tagName === 'INPUT' || node.tagName === 'TEXTAREA' || Boolean(node.isContentEditable);
      }

      document.addEventListener('selectstart', (e) => {
        if (isEditableTarget(e.target)) return;
        const el = e.target && e.target.nodeType === 1 ? e.target : (e.target ? e.target.parentElement : null);
        if (document.body.classList.contains('drawer-open') || !el || !el.closest('.msg-body')) {
          e.preventDefault();
          clearWindowSelection();
        }
      }, true);

      document.addEventListener('contextmenu', (e) => {
        if (isEditableTarget(e.target)) return;
        const el = e.target && e.target.nodeType === 1 ? e.target : (e.target ? e.target.parentElement : null);
        if (
          document.body.classList.contains('drawer-open') ||
          !el ||
          el.closest('.drawer, .drawer-backdrop, .chat-item, .top-header, .bottom-dock, .floating-panels-layer, .dock-scrim, .popover-menu, .popover-backdrop, .ctx-menu, .ctx-backdrop')
        ) {

        const active = document.activeElement;

        if (document.body.classList.contains('drawer-open') && !activeEditable) {

      function formatCompactTimestamp(date) {
        const hh = String(date.getHours()).padStart(2, '0');
        const mm = String(date.getMinutes()).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const mo = String(date.getMonth() + 1).padStart(2, '0');
        const yy = String(date.getFullYear()).slice(-2);
        return `${hh}:${mm}  \u2022  ${dd}/${mo}/${yy}`;
      }

      function formatMMSS(sec) {
        const m = Math.floor(sec / 60);
        const s = String(sec % 60).padStart(2, '0');
        return `${m}:${s}`;
      }

      function copyToClipboard(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (_) {}
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function pluralChats(n) {
        const mod10 = n % 10;
        const mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return `${n} чат`;
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return `${n} чата`;
        return `${n} чатов`;
      }

      function applyAppMicLock(mode) {
        state.micState = mode;
        const isRecording = mode === 'recording';
        const isTranscribing = mode === 'transcribing';
        const isLocked = isRecording || isTranscribing;

        document.body.classList.toggle('mic-recording', isRecording);
        document.body.classList.toggle('mic-transcribing', isTranscribing);

        appShell.querySelectorAll('button, input, textarea').forEach(el => {
          if (el === micBtn) {
            el.disabled = isTranscribing;
            if (isTranscribing) el.setAttribute('aria-disabled', 'true');
            else el.removeAttribute('aria-disabled');
            return;
          }
          el.disabled = isLocked;
          if (isLocked) el.setAttribute('aria-disabled', 'true');
          else el.removeAttribute('aria-disabled');
        });

        micBtn.classList.toggle('recording', isRecording);
        micBtn.classList.toggle('transcribing', isTranscribing);

        if (isRecording) {
          micIconSvg.classList.remove('mic-spinner-svg');
          micIconSvg.innerHTML = ICONS.micStop;
          micBtn.setAttribute('aria-label', 'Остановить запись');

      /* =====================================================================
         COMPOSER AUTO-EXPAND / AUTO-COLLAPSE + CLEAR (×) BUTTON
         ===================================================================== */
      function getAvailSingleWidth() {
        const capW = composerCapsule.clientWidth;
        if (!capW) return 112;
        return Math.max(44, capW - 22 - 150 - 24 - 28);
      }

      function measureTextSingleLine(text) {
        if (!measureCtx || !text) return 0;
        const cs = window.getComputedStyle(chatInput);
        const weight = cs.fontWeight || '400';
        const size = cs.fontSize || '18px';
        const family = cs.fontFamily || '"Google Sans", "Inter", -apple-system, BlinkMacSystemFont, sans-serif';
        measureCtx.font = `${weight} ${size} ${family}`;
        return measureCtx.measureText(text).width + 6;
      }

      function updateComposerLayout() {
        const isMicActive = state.micState !== 'idle';
        const hasAnyText = !isMicActive && chatInput.value.length > 0;
        composerInputWrap.classList.toggle('has-text', hasAnyText);

        if (!hasAnyText) {
          composerCapsule.classList.remove('is-expanded');
          state.isExpanded = false;
          chatInput.style.height = '';
          syncFloatingPanelsPosition();
          return;
        }

        const val = chatInput.value;
        const hasNewline = val.includes('\n');
        const availSingleWidth = getAvailSingleWidth();
        const measuredWidth = hasNewline ? Infinity : measureTextSingleLine(val);
        const threshold = state.isExpanded ? (availSingleWidth - 18) : (availSingleWidth - 4);

        if (!hasNewline && measuredWidth <= threshold) {
          composerCapsule.classList.remove('is-expanded');
          state.isExpanded = false;
          chatInput.style.height = '';
          syncFloatingPanelsPosition();
          return;
        }

        composerCapsule.classList.add('is-expanded');
        state.isExpanded = true;
        chatInput.style.height = 'auto';
        const targetHeight = Math.min(chatInput.scrollHeight, 156);
        chatInput.style.height = `${Math.max(25, targetHeight)}px`;
        syncFloatingPanelsPosition();
      }

         ===================================================================== */
      function closePopover() {
        state.openPopover = null;
        state.openInfoMsgId = null;
        popoverMenu.classList.remove('open', 'drop-up', 'gemini-model-menu', 'selector-menu', 'info-popover');
        popoverBackdrop.classList.remove('visible');
        document.querySelectorAll('.gemini-model-trigger.open, .panel-select-btn.open, .msg-icon-btn.info-open').forEach(el => {
          el.classList.remove('open', 'info-open');
        });
      }

      function positionPopover(anchorEl, opts = {}) {
        const {
          align = 'left',
          dropUp = false,
          autoFlip = false,
          matchWidth = false,
          fixedWidth = null
        } = opts;

        const shellRect = appShell.getBoundingClientRect();
        const rect = anchorEl.getBoundingClientRect();

        popoverMenu.style.top = 'auto';
        popoverMenu.style.bottom = 'auto';
        popoverMenu.style.left = 'auto';
        popoverMenu.style.right = 'auto';
        popoverMenu.style.width = fixedWidth ? `${fixedWidth}px` : (matchWidth ? `${Math.max(rect.width, 210)}px` : 'auto');

        const measuredH = popoverMenu.offsetHeight || 160;
        const measuredW = fixedWidth || popoverMenu.offsetWidth || 240;

        let shouldDropUp = dropUp;
        if (autoFlip) {
          const spaceBelow = shellRect.bottom - rect.bottom - 12;
          const spaceAbove = rect.top - shellRect.top - 12;
          if (spaceBelow < measuredH + 10 && spaceAbove > spaceBelow) {
            shouldDropUp = true;
          }
        }

        if (shouldDropUp) {
          popoverMenu.classList.add('drop-up');
          const bottomOffset = shellRect.bottom - rect.top + 8;
          popoverMenu.style.bottom = `${bottomOffset}px`;
        } else {
          popoverMenu.classList.remove('drop-up');
          popoverMenu.style.top = `${rect.bottom - shellRect.top + 8}px`;
        }

        if (align === 'center') {
          const leftOffset = Math.max(10, Math.round((shellRect.width - measuredW) / 2));
          popoverMenu.style.left = `${leftOffset}px`;
        } else if (align === 'right') {
          const rightOffset = Math.max(10, shellRect.right - rect.right);
          popoverMenu.style.right = `${rightOffset}px`;
        } else {
          let leftOffset = rect.left - shellRect.left;
          const maxLeft = shellRect.width - measuredW - 10;
          leftOffset = Math.max(10, Math.min(leftOffset, Math.max(10, maxLeft)));
          popoverMenu.style.left = `${leftOffset}px`;
        }
      }
