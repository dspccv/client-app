          <button class="save-btn" id="savePersonaPresetBtn">Save</button>
        </div>

        <div class="panel-field-row">
          <label class="panel-field-label" for="personaNameInput">Name:</label>
          <input
            type="text"
            class="persona-name-input"
            id="personaNameInput"
            placeholder="AI Persona"
            enterkeyhint="done"
            autocomplete="off"
          >
        </div>

        <div class="persona-textarea-wrap" id="personaTextareaWrap">
          <textarea
            class="persona-textarea"
            id="personaInstructionsInput"
            placeholder="System instructions..."
          ></textarea>
          <button class="persona-clear-btn" id="btn-clear-persona" type="button" aria-label="Очистить инструкции">
            <svg viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- =====================================================================
         5. LEFT DRAWER (#111113, NO BOTTOM FOOTER)
         ===================================================================== -->
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-top-bar">
        <div class="drawer-brand">OpenRouter <span>PWA</span></div>
        <button class="drawer-close-btn" id="closeDrawerBtn" aria-label="Закрыть меню">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="drawer-content">
        <!-- Silent Segmented Switch: OpenRouter | Direct / Custom -->
        <div class="segmented-ctrl" id="providerSwitch">
          <button class="seg-btn active" data-provider="openrouter">OpenRouter</button>
          <button class="seg-btn" data-provider="direct">Direct / Custom</button>
        </div>

        <!-- Collapsible Unclipped API Keys Accordion -->
        <div class="drawer-section-card">
          <button class="accordion-trigger" id="apiAccordionBtn" aria-expanded="false">
            <span>API ключи</span>
            <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
          <div class="accordion-collapse" id="apiAccordionCollapse">
            <div class="accordion-inner">
              <div class="accordion-body">
                <div class="field-group">
                  <label class="field-label" for="orKeyInput">OpenRouter Key</label>
                  <div class="input-wrap">
                    <input type="password" id="orKeyInput" placeholder="sk-or-v1-..." autocomplete="off">
                    <button class="eye-btn" data-toggle-pw="orKeyInput" aria-label="Показать OpenRouter Key">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                  </div>
                </div>

                <div class="field-group">
                  <label class="field-label" for="customUrlInput">Custom Endpoint URL</label>
                  <div class="input-wrap">
                    <input type="url" id="customUrlInput" placeholder="https://api.example.com/v1" autocomplete="off">
                  </div>
                </div>

                <div class="field-group">
                  <label class="field-label" for="elevenKeyInput">ElevenLabs Key</label>
                  <div class="input-wrap">
                    <input type="password" id="elevenKeyInput" placeholder="sk_..." autocomplete="off">
                    <button class="eye-btn" data-toggle-pw="elevenKeyInput" aria-label="Показать ElevenLabs Key">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Collapsible Balance & Billing Accordion -->
        <div class="drawer-section-card">
          <button class="accordion-trigger" id="balanceAccordionBtn" aria-expanded="false">
            <span>Balance &amp; Billing</span>
            <span class="accordion-trigger-right">
              <span class="accordion-balance-val" id="balanceBtnVal">$0.000</span>
              <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </span>
          </button>
          <div class="accordion-collapse" id="balanceAccordionCollapse">
            <div class="accordion-inner">
              <div class="accordion-body balance-accordion-body">
                <div id="statsPanel" aria-label="Balance and Billing"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Chat History + Right-Aligned Bulk Toolbar -->
        <div class="chat-list-section">
          <div class="chat-list-header">
            <div class="chat-list-title-wrap">
              <span class="drawer-list-title">ЧАТЫ</span>
              <span class="sel-count-badge" id="selCountBadge">0</span>
            </div>
            <div class="chat-bulk-actions">
              <button class="bulk-ico-btn trash-btn" id="bulkDeleteBtn" title="Удалить выбранные" aria-label="Удалить выбранные">
                <svg viewBox="0 0 24 24">
                  <polyline points="3 6 5 6 21 6"></polyline>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                  <path d="M10 11v6"></path>
                  <path d="M14 11v6"></path>
                  <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                </svg>
              </button>
              <button class="bulk-ico-btn" id="selectAllBtn" title="Выделить все" aria-label="Выделить все">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                  <polyline points="8.5 12.5 11 15 16 9.5"></polyline>
                </svg>
              </button>
              <button class="bulk-ico-btn" id="deselectAllBtn" title="Снять выделение" aria-label="Снять выделение">
                <svg viewBox="0 0 24 24">
                  <rect x="3" y="3" width="18" height="18" rx="4"></rect>
                  <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="chat-list" id="chatList"></div>
        </div>
      </div>
    </aside>

    <!-- =====================================================================
         POPOVERS (z-index 58 / 60), LONG-PRESS CONTEXT MENU & TOAST
         ===================================================================== -->
    <div class="popover-backdrop" id="popoverBackdrop"></div>
    <div class="popover-menu" id="popoverMenu"></div>

    <div class="ctx-backdrop" id="ctxBackdrop"></div>
    <div class="ctx-menu" id="ctxMenu" role="menu"></div>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    (function () {
      var s = document.createElement('script');
      s.src = './app.js?v=' + Date.now();
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
